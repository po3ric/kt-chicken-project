apiVersion: apps/v1
kind: Deployment

metadata:
  name: chicken-app
  namespace: chicken-app

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: chicken-app

  template:
    metadata:
      labels:
        app: chicken-app

    spec:
      # Prefer even Pod distribution across AZs and Nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chicken-app

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chicken-app

      containers:
        - name: chicken-app
          image: 916207038064.dkr.ecr.ap-northeast-2.amazonaws.com/accordion-team:v1.5
          imagePullPolicy: Always

          env:
            - name: LOAD_MAX_SECONDS
              value: "3600"

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
