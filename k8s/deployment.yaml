apiVersion: apps/v1
kind: Deployment
metadata:
  name: chicken-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chicken-app
  template:
    metadata:
      labels:
        app: chicken-app
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
      - name: chicken-app
        image: 916207038064.dkr.ecr.ap-northeast-2.amazonaws.com/accordion-team:v1.3
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
