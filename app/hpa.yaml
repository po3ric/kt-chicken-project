apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chicken-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chicken-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
