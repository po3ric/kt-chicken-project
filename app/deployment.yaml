apiVersion: apps/v1
kind: Deployment
metadata:
  name: chicken-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chicken-app
  template:
    metadata:
      labels:
        app: chicken-app
    spec:
      containers:
        - name: chicken-app
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/project/chicken-app:v1.3
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
